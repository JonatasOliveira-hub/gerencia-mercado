spring.application.name=produto-service
server.port=6061
spring.h2.console.settings.trace=true
spring.jpa.defer-datasource-initialization=true
eureka.client.service-url.default-zone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Resilience4j Circuit Breaker configuration for "ticketService"
resilience4j.circuitbreaker.instances.ticketService.register-health-indicator=true
resilience4j.circuitbreaker.instances.ticketService.sliding-window-size=10
resilience4j.circuitbreaker.instances.ticketService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.ticketService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.ticketService.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.ticketService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.ticketService.automatic-transition-from-open-to-half-open-enabled=true
